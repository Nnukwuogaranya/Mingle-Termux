<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mingle - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="bg-lights"></div>
  <div class="particles"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-shell">
          <div class="logo-3d">
            <svg viewBox="0 0 100 100" fill="none"><path d="M10 80 L10 20 L30 50 L50 20 L70 50 L90 20 L90 80" stroke="#FFD700" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <h1>MINGLE</h1>
        <p class="logo-tagline">CONNECT. SHINE. BELONG.</p>
      </div>

      <div class="auth-header">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your journey</p>
      </div>

      <div class="auth-tabs">
        <button class="active"><span>Login</span></button>
        <button><span>Sign Up</span></button>
      </div>

      <form>
        <div class="input-group">
          <input type="email" placeholder=" " id="email">
          <label for="email">Email</label>
        </div>
        <div class="input-group">
          <input type="password" placeholder=" " id="password">
          <label for="password">Password</label>
        </div>
        <div class="forgot-password"><a href="#">Forgot Password?</a></div>
        <button type="button" class="auth-btn v-btn"><span>Login</span></button>
        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="pi-btn v-btn"><span>Continue with Pi</span></button>
      </form>

      <div class="auth-footer">By joining, you agree to our <a href="#">Terms</a> & <a href="#">Privacy</a></div>
    </div>
  </div>
</body>
</html>
