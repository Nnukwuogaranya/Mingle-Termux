<div class="card">

<h2>Marketplace Rules</h2>

<p>

Mingle Marketplace is built on trust.

Users must only advertise genuine products and lawful services.

Misleading listings, counterfeit goods, fraudulent offers and deceptive business practices are prohibited and may result in immediate removal from the platform.

</p>

</div>

<div class="card">

<h2>Dating Safety</h2>

<p>

Mingle Dating is intended to help people build genuine and respectful relationships.

Harassment, blackmail, impersonation, financial exploitation, stalking and abusive behaviour are strictly prohibited.

Always respect another person's privacy and decisions.

</p>

</div>

<div class="card">

<h2>Child Safety</h2>

<p>

Protecting children is one of Mingle's highest priorities.

Any content involving child exploitation, abuse or endangerment is strictly forbidden and may be reported to the appropriate authorities where required by law.

</p>

</div>

<div class="card">

<h2>Artificial Intelligence Moderation</h2>

<p>

Mingle uses Artificial Intelligence together with human moderation to identify spam, scams, harmful content and behaviour that violates our policies.

Our goal is to make the platform safer while treating every user fairly and respectfully.

</p>

</div>

<div class="card">

<h2>Reporting Problems</h2>

<p>

If you encounter abusive behaviour, fake accounts, fraud, spam or content that violates these Guidelines, please use the in-app reporting tools or contact our Support Team.

Community reports help us maintain a safe environment for everyone.

</p>

</div>

<div class="card">

<h2>Enforcement</h2>

<p>

Depending on the seriousness of a violation, Mingle may:

</p>

<ul>

<li>Remove content.</li>

<li>Issue warnings.</li>

<li>Limit account features.</li>

<li>Suspend accounts temporarily.</li>

<li>Permanently remove accounts.</li>

<li>Report unlawful activity where legally required.</li>

</ul>

</div>

<div class="card">

<h2>Appeals</h2>

<p>

If you believe enforcement action was taken in error, you may contact Mingle Support for review.

Each appeal will be considered fairly based on the available information and our Community Guidelines.

</p>

</div>
