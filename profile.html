<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B1A">

  <title>Create Your Mingle Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: #fdfbf7;
      background:
        radial-gradient(circle at 20% 15%, rgba(111, 66, 193, 0.28), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.16), transparent 35%),
        linear-gradient(135deg, #050814, #10152d 55%, #080b1a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .profile-shell {
      width: min(100%, 460px);
    }

    .profile-card {
      position: relative;
      padding: 30px 24px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.075);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      background:
        linear-gradient(145deg, #8b5cf6, #5b21b6);
      border: 1px solid rgba(212, 175, 55, 0.55);
      box-shadow:
        0 0 30px rgba(111, 66, 193, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: #d4af37;
    }

    .brand p {
      margin: 7px 0 0;
      color: rgba(253, 251, 247, 0.68);
      font-size: 13px;
    }

    .photo-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(212, 175, 55, 0.75);
      background:
        linear-gradient(145deg, rgba(111, 66, 193, 0.8), rgba(31, 42, 68, 0.9));
      box-shadow:
        0 0 28px rgba(111, 66, 193, 0.35);
    }

    .avatar span {
      font-size: 38px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-label {
      color: #d4af37;
      font-size: 12px;
      font-weight: 600;
    }

    #profile-photo {
      display: none;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: rgba(253, 251, 247, 0.8);
      font-size: 12px;
      font-weight: 600;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      outline: none;
      border-radius: 15px;
      padding: 14px 15px;
      color: #fff;
      background: rgba(0, 0, 0, 0.22);
      font: inherit;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255, 255, 255, 0.36);
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(212, 175, 55, 0.65);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
    }

    .username-wrap {
      position: relative;
    }

    .username-wrap span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4af37;
      font-weight: 600;
    }

    .username-wrap input {
      padding-left: 30px;
    }

    .error {
      display: none;
      margin: 8px 0 14px;
      padding: 11px 13px;
      border-radius: 12px;
      color: #ffd9d9;
      background: rgba(190, 40, 40, 0.18);
      border: 1px solid rgba(255, 100, 100, 0.25);
      font-size: 12px;
    }

    .continue-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      color: #090b17;
      background: linear-gradient(135deg, #f2d675, #d4af37);
      font: inherit;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .continue-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(212, 175, 55, 0.28);
    }

    .continue-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .logout-btn {
      width: 100%;
      margin-top: 11px;
      padding: 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .logout-btn:hover {
      color: #fff;
      border-color: rgba(212, 175, 55, 0.35);
    }

    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .profile-card {
        padding: 25px 18px;
        border-radius: 23px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-shell">

    <section class="profile-card">

      <div class="brand">
        <div class="brand-logo">M</div>

        <h1>Welcome to <span>Mingle</span></h1>

        <p>Let's create your Mingle profile.</p>
      </div>

      <div id="loading" class="loading">
        Checking your account...
      </div>

      <form id="profile-form" hidden>

        <div class="photo-section">

          <label for="profile-photo">

            <div class="avatar" id="avatar">

              <span id="avatar-placeholder">👤</span>

              <img
                id="avatar-preview"
                alt="Profile preview"
              >

            </div>

          </label>

          <input
            id="profile-photo"
            type="file"
            accept="image/*"
          >

          <div class="photo-label">
            Add profile photo
          </div>

        </div>

        <div class="field">

          <label for="display-name">
            Full / Display Name
          </label>

          <input
            id="display-name"
            type="text"
            maxlength="60"
            placeholder="Enter your name"
            autocomplete="name"
            required
          >

        </div>

        <div class="field">

          <label for="username">
            Username
          </label>

          <div class="username-wrap">

            <span>@</span>

            <input
              id="username"
              type="text"
              maxlength="30"
              placeholder="yourusername"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <div class="field">

          <label for="bio">
            Bio
          </label>

          <textarea
            id="bio"
            maxlength="160"
            placeholder="Tell the Mingle community something about you..."
          ></textarea>

        </div>

        <div
          id="profile-error"
          class="error"
        ></div>

        <button
          id="continue-btn"
          class="continue-btn"
          type="submit"
        >
          Continue to Mingle
        </button>

        <button
          id="logout-btn"
          class="logout-btn"
          type="button"
        >
          Sign out
        </button>

      </form>

    </section>

  </main>

  <script type="module">

    import {
      auth,
      onAuthStateChanged,
      signOut
    } from "./firebase.js";

    const loading =
      document.getElementById("loading");

    const form =
      document.getElementById("profile-form");

    const errorEl =
      document.getElementById("profile-error");

    const photoInput =
      document.getElementById("profile-photo");

    const avatarPreview =
      document.getElementById("avatar-preview");

    const avatarPlaceholder =
      document.getElementById("avatar-placeholder");

    const displayNameInput =
      document.getElementById("display-name");

    const usernameInput =
      document.getElementById("username");

    const bioInput =
      document.getElementById("bio");

    const continueBtn =
      document.getElementById("continue-btn");

    const logoutBtn =
      document.getElementById("logout-btn");

    let currentUser = null;

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }

    function hideError() {
      errorEl.textContent = "";
      errorEl.style.display = "none";
    }

    function cleanUsername(value) {
      return value
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]/g, "")
        .slice(0, 30);
    }

    photoInput.addEventListener("change", () => {

      const file = photoInput.files?.[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showError("Please select an image file.");
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {

        avatarPreview.src = reader.result;

        avatarPreview.style.display = "block";

        avatarPlaceholder.style.display = "none";

      };

      reader.readAsDataURL(file);

    });

    usernameInput.addEventListener("input", () => {

      usernameInput.value =
        cleanUsername(usernameInput.value);

    });

    onAuthStateChanged(auth, (user) => {

      loading.hidden = true;

      if (!user) {

        window.location.href = "login.html";

        return;

      }

      if (!user.emailVerified) {

        window.location.href = "login.html";

        return;

      }

      currentUser = user;

      form.hidden = false;

      if (user.displayName) {
        displayNameInput.value =
          user.displayName;
      }

    });

    form.addEventListener("submit", (event) => {

      event.preventDefault();

      hideError();

      if (!currentUser) {
        showError("Your account session could not be found.");
        return;
      }

      const displayName =
        displayNameInput.value.trim();

      const username =
        cleanUsername(usernameInput.value);

      const bio =
        bioInput.value.trim();

      if (displayName.length < 2) {
        showError("Please enter your name.");
        return;
      }

      if (username.length < 3) {
        showError(
          "Username must contain at least 3 letters or numbers."
        );
        return;
      }

      continueBtn.disabled = true;
      continueBtn.textContent = "Saving profile...";

      const profile = {
        uid: currentUser.uid,
        email: currentUser.email || "",
        displayName,
        username,
        bio,
        photo: avatarPreview.src || "",
        createdAt: new Date().toISOString()
      };

      localStorage.setItem(
        "mingle_profile",
        JSON.stringify(profile)
      );

      localStorage.setItem(
        "mingle_profile_complete",
        "true"
      );

      window.location.href = "home.html";

    });

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        localStorage.removeItem("mingle_profile");
        localStorage.removeItem("mingle_profile_complete");

        window.location.href = "login.html";

      } catch (error) {

        showError(
          error?.message ||
          "Unable to sign out."
        );

      }

    });

  </script>

</body>
</html>
